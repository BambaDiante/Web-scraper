<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icons_names=search,account_circle" />
    <link rel="stylesheet" href="../static/header.css">
    <title>Page des details</title>
    <style>
       :root{
        --primary-color:#4B0082;
        --primary-hover:#37006B;
        --text-main:#1A1A1A;
        --text-muted:#6C757D;
        }

        body{
            background:#E5E4E2;
            font-family:'Montserrat', sans-serif;
        }

        /* MAIN */
        main{
            width:90%;
            max-width:1200px;
            margin:40px auto;
            display:flex;
            gap:40px;
            align-items:stretch;
        }

        /* IMAGE */
        .product-img{
            flex:1;
            background:white;
            border-radius:22px;
            padding:30px;
            display:flex;
            justify-content:center;
            align-items:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
            overflow:hidden;
        }

        .product-img img{
            width:100%;
            max-height:500px;
            object-fit:contain;
            transition:0.4s ease;
        }

        .product-img img:hover{
            transform:scale(1.03);
        }

        /* INFO */
        .product-info{
            flex:1;
            background:white;
            border-radius:22px;
            padding:45px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
        }

        .product-info h1{
            font-size:2.2rem;
            font-weight:700;
            line-height:1.3;
            color:var(--text-main);
            margin-bottom:25px;
        }

        /* PRIX */
        .price{
            font-size:2rem;
            font-weight:700;
            color:var(--primary-color);
            margin-bottom:20px;
        }

        /* SOURCE */
        .source{
            color:var(--text-muted);
            font-size:1rem;
            margin-bottom:35px;
        }

        .source span{
            background:#F2F3F5;
            color:var(--text-main);
            padding:5px 14px;
            border-radius:10px;
            font-weight:600;
        }

        /* BOUTON */
        .btn-product{
            background:var(--primary-color);
            color:white;
            text-decoration:none;
            padding:16px 30px;
            border-radius:14px;
            font-weight:600;
            font-size:1rem;
            transition:0.3s ease;
            width:fit-content;
            box-shadow:0 5px 15px rgba(75,0,130,0.2);
            margin:0 auto; 
        }

        .btn-product:hover{
            background:var(--primary-hover);
            color:white;
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(75,0,130,0.3);
        }

        @media(max-width:992px){

            main{
                flex-direction:column;
            }

            .product-info{
                padding:30px;
            }

            .product-info h1{
                font-size:1.7rem;
            }

            .price{
                font-size:1.6rem;
            }

            .btn-product{
                width:100%;
                text-align:center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Versus</h1>
        </div>

        <div class="dropdown">
            <button class="btn btn-dropdown dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                Category
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Divers</a></li>
                <li><a class="dropdown-item" href="#">Electromenager</a></li>
                <li><a class="dropdown-item" href="#">Informatique</a></li>
                <li><a class="dropdown-item" href="#">Sport</a></li>
            </ul>
        </div>

        <form action="/search" method="POST" id="search-bar" class="search-container">
            <input type="search" name="prod" placeholder="Rechercher un produit..." aria-label="Search">
            <button type="submit" id="search-button">
                <span class="material-symbols-outlined">search</span>
            </button>
        </form>

        <div class="box-account dropdown">
            <span class="material-symbols-outlined">account_circle</span>
            <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                Mon compte
            </button>
            <ul class="dropdown-menu dropdown-menu-end"> <li><a class="dropdown-item" href="{{ url_for('login') }}">Me connecter / M'inscrire</a></li>
                <li><a class="dropdown-item" href="#">Dashboard</a></li>
            </ul>
        </div>
    </header>
    <main>

        <section class="product-img">
            <img src="{{produit['lien']}}" alt="Produit">
        </section>

        <section class="product-info">

            <h1>{{produit['titre']}}</h1>

            <div class="price">
                {{produit['prix']}} F CFA
            </div>

            <div class="source">
                Provenance :
                <span>{{produit['source']}}</span>
            </div>

            {% if produit.get('url') %}
                <a href="{{ produit['url'] }}" target="_blank" class="btn-product">
                  Acheter
                </a>
            {% else %}
                <p>Lien indisponible</p>
            {% endif %}

        </section>
    </main>
</body>
</html>
